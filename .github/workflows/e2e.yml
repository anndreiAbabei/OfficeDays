name: C# E2E

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/OfficeDays.Web/package-lock.json
      - name: Install frontend dependencies
        working-directory: src/OfficeDays.Web
        run: npm ci
      - name: Build frontend
        working-directory: src/OfficeDays.Web
        run: npm run build
      - name: Build backend and tests
        run: dotnet build
      - name: Install Chromium and system dependencies
        run: dotnet run --no-build --project tests/OfficeDays.E2ETests -- install --with-deps chromium
      - name: Run browser tests
        run: dotnet test --project tests/OfficeDays.E2ETests --no-build --report-xunit-trx --results-directory artifacts/e2e/results
      - name: Upload results, screenshots, traces and API logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: officedays-e2e
          path: artifacts/e2e/
          if-no-files-found: ignore
          retention-days: 14
