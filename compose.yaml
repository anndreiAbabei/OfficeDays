services:
  office-days:
    build:
      context: .
    ports:
      - "8080:8080"
    environment:
      BootstrapAdmin__Password: "${OFFICEDAYS_ADMIN_PASSWORD:?Set OFFICEDAYS_ADMIN_PASSWORD}"
      BootstrapAdmin__TimeZoneId: "${OFFICEDAYS_ADMIN_TIMEZONE:-Europe/Bucharest}"
      BootstrapAdmin__CountryCode: "${OFFICEDAYS_ADMIN_COUNTRY_CODE:-RO}"
      BootstrapAdmin__CountryName: "${OFFICEDAYS_ADMIN_COUNTRY_NAME:-Romania}"
    volumes:
      - office-days-data:/app/data
    restart: unless-stopped

volumes:
  office-days-data:
