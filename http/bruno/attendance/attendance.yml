info:
  name: attendance
  type: http
  seq: 1

http:
  method: GET
  url: https://{{ApiHost}}/api/attendance?year=2026&month=9
  params:
    - name: year
      value: "2026"
      type: query
    - name: month
      value: "9"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
